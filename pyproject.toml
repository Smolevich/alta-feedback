[project]
name = "alta-feedback"
version = "0.1.0"
description = "Приём правок к публичной странице про банк ALTA (alta.smolevich.com)"
requires-python = ">=3.13"
dependencies = [
    "starlette>=0.47",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alta_feedback"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
