<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Предложить правку{% endblock %}</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #66645e;
    --line: #dcd9d0; --accent: #1f5f8b; --accent-ink: #ffffff; --danger: #a3271f;
    --danger-bg: #fbeceb; --ok: #23663a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 16px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; font-size: 15px; }
  .hint { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  input[type=text], textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
  }
  textarea { min-height: 160px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .errors {
    background: var(--danger-bg); color: var(--danger); border-radius: 10px;
    padding: 10px 12px; margin: 0 0 8px; font-size: 15px;
  }
  .errors p { margin: 0; }
  button {
    display: block; width: 100%; margin-top: 22px; min-height: 48px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; font-size: 17px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .back { display: inline-block; margin-top: 18px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .back:hover { text-decoration: underline; }
  .done { font-size: 40px; line-height: 1; color: var(--ok); margin: 0 0 10px; }
  .foot { color: var(--muted); font-size: 13px; margin-top: 16px; text-align: center; }
  @media (min-width: 720px) {
    main { padding-top: 56px; }
    .card { padding: 32px 32px 28px; }
    h1 { font-size: 26px; }
  }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
{% block head %}{% endblock %}
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "fe16933a65524594b31524da4c01f99c"}'></script>
</head>
<body>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
