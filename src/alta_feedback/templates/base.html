<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Предложить правку{% endblock %}</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #66645e;
    --line: #dcd9d0; --accent: #1f5f8b; --accent-ink: #ffffff; --danger: #a3271f;
    --danger-bg: #fbeceb; --ok: #23663a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 16px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; font-size: 15px; }
  .hint { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  input[type=text], textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
  }
  textarea { min-height: 160px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .errors {
    background: var(--danger-bg); color: var(--danger); border-radius: 10px;
    padding: 10px 12px; margin: 0 0 8px; font-size: 15px;
  }
  .errors p { margin: 0; }
  button {
    display: block; width: 100%; margin-top: 22px; min-height: 48px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; font-size: 17px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .back { display: inline-block; margin-top: 18px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .back:hover { text-decoration: underline; }
  .done { font-size: 40px; line-height: 1; color: var(--ok); margin: 0 0 10px; }
  .foot { color: var(--muted); font-size: 13px; margin-top: 16px; text-align: center; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { display: block; font-weight: 600; font-size: 15px; padding: 0; margin: 20px 0 8px; }
  legend label { margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  label.chip { display: inline-flex; margin: 0; font-weight: 500; position: relative; }
  .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chip span {
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer;
    font-size: 15px; line-height: 1.2; user-select: none;
  }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=date] {
    font: inherit; font-size: 16px; color: var(--ink); background: #fff; min-height: 44px;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-width: 100%;
  }
  .other-field { margin-top: 8px; }
  /* Поле «другой» прячем, только если браузер умеет :has() — иначе оно просто всегда видно. */
  @supports selector(:has(*)) {
    .other-field { display: none; }
    fieldset:has(input[value=other]:checked) .other-field { display: block; }
  }
  textarea#comment { min-height: 110px; }
  button.mic {
    display: inline-flex; align-items: center; gap: 6px; width: auto; min-height: 44px; margin-top: 8px;
    padding: 8px 16px; background: #fff; color: var(--accent); border: 1px solid var(--accent);
    font-size: 15px; border-radius: 999px;
  }
  button.mic[hidden] { display: none; }
  button.mic.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .warn { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  @media (min-width: 720px) {
    main { padding-top: 56px; }
    .card { padding: 32px 32px 28px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
